services:
  db:
    image: postgres:16-alpine
    container_name: libreria-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: libreria_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d libreria_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: libreria-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/libreria_db
      SQL_ECHO: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: libreria-frontend
    environment:
      API_UPSTREAM: backend:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
